version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    groups:
      cargo-deps:
        patterns:
          - '*'
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
  - package-ecosystem: github-actions
    directory: /
    groups:
      actions:
        patterns:
          - '*'
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
