[package]
name = "ip-ranger"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7.7"
env_logger = "0.11.5"
ipnetwork = "0.20.0"
log = "0.4.22"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.132"
tokio = { version = "1.41.1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
hyper = "1.5.0"
tower = "0.5.1"
