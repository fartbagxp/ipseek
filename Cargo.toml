[package]
name = "ipseek"
version = "1.0.0"
edition = "2021"

[dependencies]
axum = "0.8.8"
env_logger = "0.11.5"
ipnet = { version = "2.10.1", features = ["serde"] }
ipnetwork = "0.21.1"
iptrie = "0.10.3"
log = "0.4.29"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.148"
reqwest = { version = "0.12.28", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1.41.1", features = ["macros", "rt-multi-thread", "fs"] }
rkyv = "0.8.12"
tempfile = "3.24.0"
anyhow = "1.0"
flate2 = "1.1"
clap = { version = "4.5.53", features = ["derive"] }

[dev-dependencies]
hyper = "1.5.0"
tower = "0.5.1"
